# Model and training hyperparameters
dataset:
  name: "LGG-MRI-Segmentation"
  data_dir: "./lgg-mri-segmentation/kaggle_3m"
  image_size: [256, 256]
  in_channels: 3
  out_channels: 1

training:
  batch_size: 16
  learning_rate: 0.0003
  epochs: 10
  train_split: 0.8
  loss: "DiceBCELoss"
  optimizer: "Adam"

reconstruction:
  iso_threshold: 0.5
  pixel_spacing_x: 0.686
  pixel_spacing_y: 0.686
  slice_thickness: 5.0
  export_filename: "TumorMesh.obj"